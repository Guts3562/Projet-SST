services:
  db:
    image: postgres:15-alpine
    container_name: sst-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      POSTGRES_DB: ${DB_NAME:-sst_tunisie}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - sst-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sst-app
    restart: always
    ports:
      - "5173:5173"
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/server/node_modules
    environment:
      NODE_ENV: development
      PORT: ${PORT:-5000}
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-sst_tunisie}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      REFRESH_SECRET: ${REFRESH_SECRET:?Set REFRESH_SECRET in the root .env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sst-network

volumes:
  pgdata:

networks:
  sst-network:
    driver: bridge
