services:
  db:
    image: postgres:15-alpine
    container_name: sst-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: guts
      POSTGRES_DB: sst_tunisie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - sst-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sst-app
    restart: always
    ports:
      - "5173:5173"
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_USER=postgres
      - DB_HOST=db
      - DB_NAME=sst_tunisie
      - DB_PASSWORD=guts
      - DB_PORT=5432
      - JWT_SECRET=a3f8c2e1d9b74f6a0c5e2d8b1f4a7c3e6d9b2f5a8c1e4d7b0f3a6c9e2d5b8f1a4
      - REFRESH_SECRET=b7e2f5a8c1d4g7b0f3a6c9e2d5b8f1a4b7e2f5a8c1d4g7h0i3j6k9l2m5n8o1p4
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sst-network

volumes:
  pgdata:

networks:
  sst-network:
    driver: bridge
