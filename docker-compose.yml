version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sst-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: guts
      POSTGRES_DB: sst_tunisie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - sst-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sst-app
    restart: always
    ports:
      - "5173:5173" # Vite Frontend
      - "5000:5000" # Express Backend
      - "5678:5678" # n8n
    volumes:
      - .:/app
      - /app/node_modules
      - /app/server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_USER=postgres
      - DB_HOST=db
      - DB_NAME=sst_tunisie
      - DB_PASSWORD=guts
      - DB_PORT=5432
      - JWT_SECRET=a3f8c2e1d9b74f6a0c5e2d8b1f4a7c3e6d9b2f5a8c1e4d7b0f3a6c9e2d5b8f1a4
      - REFRESH_SECRET=b7e2f5a8c1d4g7b0f3a6c9e2d5b8f1a4b7e2f5a8c1d4g7h0i3j6k9l2m5n8o1p4
      - N8N_WEBHOOK_URL=https://louayhafyen.app.n8n.cloud/webhook/sst-chatbot
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
    depends_on:
      - db
    networks:
      - sst-network

volumes:
  pgdata:

networks:
  sst-network:
    driver: bridge
